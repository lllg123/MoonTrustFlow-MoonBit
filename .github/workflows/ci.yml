name: MoonTrustFlow CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1.22
        with:
          version: 0.10.3+16975d007
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify toolchain
        run: |
          moon version --all
          moon update

      - name: Moon check
        run: moon check --target all

      - name: Moon test
        run: moon test --target all

      - name: Formatter cleanliness
        run: |
          moon fmt
          git diff --exit-code

      - name: Public API cleanliness
        run: |
          moon info
          git diff --exit-code

      - name: Embedded sample run
        run: moon run cmd/main

      - name: Fixture JSON analysis (Unix)
        if: runner.os != 'Windows'
        run: |
          python scripts/analyze_model.py fixtures/models/webapp_taint.mtf --json

      - name: Fixture JSON analysis (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/analyze_model.py fixtures/models/webapp_taint.mtf --json
