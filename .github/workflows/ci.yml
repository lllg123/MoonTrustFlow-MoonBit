name: MoonTrustFlow CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup native compiler (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Setup native compiler (macOS)
        if: runner.os == 'macOS'
        run: xcode-select -p

      - name: Setup MoonBit (Unix)
        if: runner.os != 'Windows'
        run: |
          export MOONBIT_INSTALL_VERSION=0.10.3+16975d007
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Setup MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:MOONBIT_INSTALL_VERSION = "0.10.3+16975d007"
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          echo "$HOME\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Setup native compiler (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc

      - name: Verify toolchain
        run: |
          moon version --all
          moon update

      - name: Moon check
        run: moon check --target all --deny-warn

      - name: Moon test
        run: moon test --target all --deny-warn

      - name: Formatter cleanliness
        run: |
          moon fmt
          git diff --exit-code

      - name: Public API cleanliness
        run: |
          moon info
          git diff --exit-code

      - name: Embedded sample run
        run: moon run cmd/main

      - name: Application review modes
        run: |
          moon run cmd/main -- --sarif > "$RUNNER_TEMP/moontrustflow-sarif.json"
          grep -q '"version": "2.1.0"' "$RUNNER_TEMP/moontrustflow-sarif.json"
          moon run cmd/main -- --assessment > "$RUNNER_TEMP/moontrustflow-assessment.txt"
          grep -q 'risk_score=' "$RUNNER_TEMP/moontrustflow-assessment.txt"
          moon run cmd/main -- --graph > "$RUNNER_TEMP/moontrustflow-graph.txt"
          grep -q 'graph digest=' "$RUNNER_TEMP/moontrustflow-graph.txt"
          moon run cmd/main -- --contract > "$RUNNER_TEMP/moontrustflow-contract.txt"
          grep -Eq 'quality_gate|contract=' "$RUNNER_TEMP/moontrustflow-contract.txt"

      - name: Fixture JSON analysis (Unix)
        if: runner.os != 'Windows'
        run: |
          python scripts/analyze_model.py fixtures/models/webapp_taint.mtf --json

      - name: Fixture corpus validation (Unix)
        if: runner.os != 'Windows'
        run: python scripts/verify_fixture_corpus.py

      - name: Fixture JSON analysis (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/analyze_model.py fixtures/models/webapp_taint.mtf --json

      - name: Fixture corpus validation (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python scripts/verify_fixture_corpus.py
